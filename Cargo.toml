[package]
name = "plat"
version = "0.1.0"
edition = "2024"
description = "A fast disk usage analyser for the terminal, with a nested treemap and batch deletion"
license = "GPL-3.0-or-later"

[dependencies]
lexopt = "0.3.2"
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
rustix = { version = "1.1.6", features = ["fs", "process"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
